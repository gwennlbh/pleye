name: Docker image

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Get some info for OpenContainer values from Github API
        id: meta
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "description=$(gh api repos/${{github.repository}} --jq .description)" >> $GITHUB_OUTPUT
          echo "now=$(date --utc --iso-8601=seconds)" >> $GITHUB_OUTPUT
      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          file: ./Dockerfile
          build-args: |
            description=${{ steps.meta.outputs.description }}
            created_at=${{ steps.meta.outputs.now }}
            revision=${{ github.sha }}
            repository=https://github.com/${{ github.repository }}
      - name: Deploy new version on production
        env:
          SA: ${{ secrets.HYPERFLUID_SERVICE_ACCOUNT }}
          ENV: Default
          APP: pleye
        run: |
          echo "$SA" > sa.json
          curl -fsSL https://ai.meso.umontpellier.fr/downloads/install.sh | sh
          hfctl auth login --service-account sa.json
          hfctl config set env "$ENV"
          hfctl apps restart "$APP"
